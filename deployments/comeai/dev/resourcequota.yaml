apiVersion: v1
kind: ResourceQuota
metadata:
  name: open-im-single-node-budget
  namespace: open-im
  labels:
    app.kubernetes.io/part-of: open-im
    environment: dev
    project: comeai
spec:
  hard:
    # 现有工作负载使用 2900m；Group RPC 和 Push 各需 350m 上限。
    limits.cpu: 3600m
    limits.memory: 7Gi
    persistentvolumeclaims: "1"
    requests.cpu: 1800m
    requests.memory: 6Gi
    requests.storage: 10Gi
